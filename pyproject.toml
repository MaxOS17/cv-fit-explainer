[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-fit-explainer"
version = "0.1.0"
description = "Agent that explains how well a CV fits a job description: match score, gaps, tailored bullets, interview prep."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "docx2txt>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cv-fit-explainer = "cv_fit_explainer.__main__:main"

[tool.setuptools.packages.find]
include = ["cv_fit_explainer*"]
